name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          node scripts/python.mjs -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install chromium
      - name: Installer lifecycle
        run: node scripts/python.mjs tests/install_smoke.py
      - run: npm test
      - run: npm run test:browser
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: test-results/
